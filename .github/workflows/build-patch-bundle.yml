name: Build official ReVanced patch bundle for ZUNOX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - ".github/workflows/build-patch-bundle.yml"
  pull_request:
    paths:
      - "profiles/**"
      - ".github/workflows/build-patch-bundle.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: zunox-revanced-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ReVanced patches from the official GitLab mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUNOX profile
        uses: actions/checkout@v4

      - name: Clone the ReVanced patch source requested by the user
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.com/ReVanced/revanced-patches.git upstream/revanced-patches
          cd upstream/revanced-patches
          echo "ReVanced source commit: $(git rev-parse HEAD)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build official ReVanced patch project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd upstream/revanced-patches
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: Verify ReVanced patch bundle (.rvp)
        run: |
          set -euo pipefail
          RVP="$(find upstream/revanced-patches/patches/build -type f -name '*.rvp' -print -quit)"
          test -n "$RVP"
          echo "Built bundle: $RVP"

      - name: Upload official ReVanced patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: zunox-revanced-patches
          path: upstream/revanced-patches/patches/build/**/*.rvp
          if-no-files-found: error
          retention-days: 14
