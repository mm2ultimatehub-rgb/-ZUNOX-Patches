name: Build ZUNOX patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "upstream/morphe-patches"
      - ".github/workflows/build-patch-bundle.yml"
  pull_request:
    paths:
      - "profiles/**"
      - "upstream/morphe-patches"
      - ".github/workflows/build-patch-bundle.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: zunox-patch-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile pinned patch source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUNOX patch profile and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          cd upstream/morphe-patches
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :patches:build

      - name: Verify patch JAR was produced
        run: |
          set -euo pipefail
          find upstream/morphe-patches/patches/build/libs -maxdepth 1 -type f -name '*.jar' -print -quit | grep -q .

      - name: Upload compiled patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: zunox-patch-bundle
          path: upstream/morphe-patches/patches/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
